
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Workout Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --green: #1C4E3F; --green-mid: #2E7057; --green-light: #3D8A69;
    --pink: #8A2C5F;
    --bg: #F8F7F4; --card: #ffffff; --gray: #EEEBE4;
    --text: #1A1A1A; --muted: #888888;
    --radius: 14px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; max-width: 480px; margin: 0 auto; }

  #user-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
  .app-logo { width: 72px; height: 72px; background: var(--green); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; box-shadow: 0 8px 24px rgba(28,78,63,0.25); }
  .app-logo svg { width: 38px; height: 38px; fill: white; }
  #user-screen h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; text-align: center; }
  #user-screen > p { color: var(--muted); font-size: 15px; margin-bottom: 40px; text-align: center; }
  .user-card { width: 100%; background: var(--card); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 14px; display: flex; align-items: center; gap: 16px; cursor: pointer; border: 2px solid transparent; box-shadow: var(--shadow); transition: all 0.18s; }
  .user-card:active { transform: scale(0.97); }
  .user-card:hover { border-color: var(--green-light); }
  .user-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: white; flex-shrink: 0; }
  .avatar-b { background: var(--green); }
  .avatar-a { background: var(--pink); }
  .user-info h3 { font-size: 17px; font-weight: 600; }
  .user-info p { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .user-arrow { margin-left: auto; color: var(--muted); font-size: 20px; }

  #app { display: none; min-height: 100vh; flex-direction: column; }
  .header { background: var(--green); padding: 52px 20px 16px; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .header-user { display: flex; align-items: center; gap: 10px; }
  .header-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; border: 2px solid rgba(255,255,255,0.4); }
  .header-name { color: rgba(255,255,255,0.9); font-size: 14px; font-weight: 500; }
  .switch-btn { background: rgba(255,255,255,0.15); border: none; color: white; font-size: 12px; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-weight: 500; }
  .header h2 { color: white; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .header-sub { color: rgba(255,255,255,0.65); font-size: 13px; }

  .day-tabs-wrap { background: var(--green); position: sticky; top: 0; z-index: 99; }
  .day-tabs { display: flex; overflow-x: auto; gap: 4px; padding: 0 16px; scrollbar-width: none; }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab { flex-shrink: 0; padding: 10px 16px 12px; background: transparent; border: none; color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 10px 10px 0 0; transition: all 0.15s; white-space: nowrap; }
  .day-tab.active { background: var(--bg); color: var(--green); }
  .rest-tab { opacity: 0.45; }

  .content { flex: 1; padding: 16px; }

  .progress-bar-wrap { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .progress-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .progress-label span { font-size: 13px; color: var(--muted); font-weight: 500; }
  .progress-label strong { font-size: 13px; color: var(--green); font-weight: 700; }
  .progress-track { height: 6px; background: var(--gray); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green-light); border-radius: 3px; transition: width 0.35s ease; }

  .day-label-pill { display: inline-block; background: #e8f5ee; color: var(--green-mid); font-size: 11px; font-weight: 700; border-radius: 6px; padding: 3px 10px; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }

  .exercise-card { background: var(--card); border-radius: var(--radius); margin-bottom: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .exercise-card.all-done { opacity: 0.6; }
  .exercise-card.all-done .ex-name { text-decoration: line-through; color: var(--muted); }
  .ex-header { padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
  .ex-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .ex-muscle { font-size: 12px; color: var(--green-light); font-weight: 600; }
  .ex-pill { background: var(--bg); border-radius: 6px; padding: 3px 8px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .ex-pill.done-pill { color: var(--green); background: #e8f5ee; }
  .ex-pill.partial-pill { color: var(--green-mid); background: #e8f5ee; }
  .ex-expand-btn { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; flex-shrink: 0; transition: transform 0.2s; line-height: 1; padding: 2px; }
  .ex-expand-btn.open { transform: rotate(180deg); }

  .sets-panel { display: none; border-top: 1px solid var(--gray); }
  .sets-panel.open { display: block; }
  .sets-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; padding: 12px 16px 6px; }
  .sets-row { display: flex; gap: 8px; padding: 0 16px 14px; flex-wrap: wrap; }
  .set-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--bg); border: 2px solid var(--gray); border-radius: 10px; padding: 8px 10px; cursor: pointer; transition: all 0.15s; min-width: 54px; font-family: inherit; }
  .set-btn:active { transform: scale(0.9); }
  .set-btn .snum { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .set-btn .scheck { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ccc; background: white; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .set-btn.done-set { background: #e8f5ee; border-color: var(--green-light); }
  .set-btn.done-set .snum { color: var(--green-mid); }
  .set-btn.done-set .scheck { background: var(--green); border-color: var(--green); }
  .ck { display: none; }
  .set-btn.done-set .ck { display: block; }

  .desc-toggle { width: 100%; background: none; border: none; border-top: 1px solid var(--gray); color: var(--muted); font-size: 12px; font-weight: 600; padding: 10px 16px; text-align: left; cursor: pointer; font-family: inherit; display: flex; justify-content: space-between; align-items: center; }
  .desc-section { display: none; padding: 12px 16px 16px; }
  .desc-section.open { display: block; }
  .ex-desc { font-size: 14px; color: #444; line-height: 1.65; margin-bottom: 12px; }
  .video-btn { display: flex; align-items: center; gap: 8px; background: var(--green); color: white; border: none; border-radius: 10px; padding: 11px 16px; width: 100%; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; justify-content: center; }
  .video-btn svg { width: 18px; height: 18px; fill: white; flex-shrink: 0; }

  .rest-card { background: var(--card); border-radius: var(--radius); padding: 40px 24px; text-align: center; box-shadow: var(--shadow); }
  .rest-icon { font-size: 48px; margin-bottom: 12px; }
  .rest-card h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .rest-card p { font-size: 14px; color: var(--muted); line-height: 1.6; }

  .eq-tag { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 2px 6px; margin-left: 2px; text-transform: uppercase; letter-spacing: 0.4px; vertical-align: middle; }
  .eq-cable { color: #1a5276; background: #d6eaf8; }
  .eq-dumbbell { color: #4a235a; background: #e8daef; }
  .eq-pullup { color: #1e4d2b; background: #d5f5e3; }
  .eq-bw { color: #6b4c1e; background: #fdebd0; }

  /* ── PROFILE DASHBOARD ── */
  .profile-screen { display: none; flex-direction: column; padding: 0 0 32px; }
  .profile-header { background: var(--green); padding: 52px 20px 24px; }
  .profile-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .profile-title { color: white; font-size: 22px; font-weight: 700; }
  .profile-sub { color: rgba(255,255,255,0.65); font-size: 13px; }
  .profile-back { background: rgba(255,255,255,0.15); border: none; color: white; font-size: 12px; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-weight: 500; }
  .profile-body { padding: 16px; }
  .profile-avatar-row { display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .profile-avatar-big { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: white; flex-shrink: 0; }
  .profile-user-name { font-size: 20px; font-weight: 700; }
  .profile-user-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .profile-section-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; margin: 18px 0 8px; }
  .stat-card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .stat-card-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .last-workout-row { display: flex; align-items: center; gap: 12px; }
  .last-workout-icon { width: 40px; height: 40px; border-radius: 10px; background: #e8f5ee; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .last-workout-info h4 { font-size: 15px; font-weight: 600; }
  .last-workout-info p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .week-cell { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--gray); }
  .week-cell .wday { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .week-cell .wpct { font-size: 11px; font-weight: 800; color: var(--muted); margin-top: 2px; }
  .week-cell.rest { opacity: 0.4; }
  .week-cell.partial { background: #c8e6c9; }
  .week-cell.partial .wday, .week-cell.partial .wpct { color: var(--green-mid); }
  .week-cell.full { background: var(--green); }
  .week-cell.full .wday, .week-cell.full .wpct { color: white; }
  .week-cell.empty { background: var(--gray); }
  .compare-row { display: flex; gap: 10px; }
  .compare-box { flex: 1; background: var(--bg); border-radius: 10px; padding: 12px; text-align: center; }
  .compare-box .cb-val { font-size: 22px; font-weight: 800; color: var(--green); }
  .compare-box .cb-lbl { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .compare-box.last { }
  .compare-box .cb-val.last-val { color: var(--muted); }
  .no-data { font-size: 14px; color: var(--muted); text-align: center; padding: 20px 0; }

  /* ── VIDEO MODAL ── */
  .video-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; flex-direction: column; padding: 24px; }
  .video-modal.open { display: flex; }
  .video-modal-inner { width: 100%; max-width: 440px; }
  .video-modal-title { color: white; font-size: 15px; font-weight: 600; margin-bottom: 12px; text-align: center; }
  .video-close { background: rgba(255,255,255,0.15); border: none; color: white; font-size: 13px; font-weight: 600; padding: 10px 24px; border-radius: 20px; cursor: pointer; margin-top: 14px; width: 100%; font-family: inherit; }
  .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; }
  .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

  /* Profile button on user card */
  .profile-btn { margin-top: 6px; background: none; border: none; color: var(--green-mid); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; padding: 0; text-decoration: underline; }

  /* ── WEIGHT INPUT ── */
  .weight-row { display: flex; gap: 8px; padding: 0 16px 14px; align-items: center; flex-wrap: wrap; }
  .weight-input-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 72px; }
  .weight-input-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .weight-input { width: 72px; padding: 7px 8px; border: 2px solid var(--gray); border-radius: 8px; font-size: 13px; font-weight: 700; text-align: center; background: var(--bg); color: var(--text); font-family: inherit; outline: none; }
  .weight-input:focus { border-color: var(--green-light); background: white; }
  .weight-input.pr-set { border-color: #f0a500; background: #fffbf0; }
  .weight-prev { font-size: 10px; color: var(--muted); text-align: center; }
  .weight-prev.has-pr { color: #f0a500; font-weight: 700; }

  /* ── STREAK BANNER ── */
  .streak-banner { background: linear-gradient(135deg, #1C4E3F, #2E7057); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
  .streak-fire { font-size: 28px; }
  .streak-text h3 { color: white; font-size: 16px; font-weight: 700; }
  .streak-text p { color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 2px; }
  .streak-count { margin-left: auto; background: rgba(255,255,255,0.15); border-radius: 10px; padding: 6px 12px; color: white; font-size: 20px; font-weight: 800; }

  /* ── PR BADGE ── */
  .pr-badge { display: inline-flex; align-items: center; gap: 4px; background: #fff8e1; color: #f0a500; border: 1.5px solid #f0a500; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 800; margin-left: 4px; }

  /* ── COMPLETION OVERLAY ── */
  .completion-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; }
  .completion-overlay.show { display: flex; }
  .completion-card { background: white; border-radius: 24px; padding: 40px 32px; text-align: center; max-width: 320px; width: 90%; position: relative; animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .completion-emoji { font-size: 64px; margin-bottom: 16px; display: block; }
  .completion-card h2 { font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
  .completion-card p { font-size: 15px; color: var(--muted); line-height: 1.5; margin-bottom: 24px; }
  .completion-stats { display: flex; gap: 12px; margin-bottom: 24px; }
  .completion-stat { flex: 1; background: var(--bg); border-radius: 12px; padding: 12px 8px; }
  .completion-stat .cs-val { font-size: 20px; font-weight: 800; color: var(--green); }
  .completion-stat .cs-lbl { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .completion-dismiss { background: var(--green); color: white; border: none; border-radius: 12px; padding: 14px 32px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit; }
  .confetti-piece { position: fixed; width: 10px; height: 10px; border-radius: 2px; animation: confettiFall linear forwards; pointer-events: none; z-index: 1001; }
  @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

  /* ── STREAK on profile ── */
  .streak-stat { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .streak-stat .fire { font-size: 22px; }
  .streak-stat .streak-info h4 { font-size: 15px; font-weight: 700; }
  .streak-stat .streak-info p { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>


<div class="video-modal" id="video-modal">
  <div class="video-modal-inner">
    <div class="video-modal-title" id="video-modal-title"></div>
    <div class="video-wrapper">
      <iframe id="video-iframe" allowfullscreen allow="autoplay"></iframe>
    </div>
    <button class="video-close" onclick="closeVideo()">✕ Close</button>
  </div>
</div>


<div class="completion-overlay" id="completion-overlay">
  <div class="completion-card">
    <span class="completion-emoji" id="comp-emoji">🎉</span>
    <h2 id="comp-title">Workout Complete!</h2>
    <p id="comp-msg"></p>
    <div class="completion-stats">
      <div class="completion-stat">
        <div class="cs-val" id="comp-sets">0</div>
        <div class="cs-lbl">Sets done</div>
      </div>
      <div class="completion-stat">
        <div class="cs-val" id="comp-prs">0</div>
        <div class="cs-lbl">New PRs 🏆</div>
      </div>
      <div class="completion-stat">
        <div class="cs-val" id="comp-streak">0🔥</div>
        <div class="cs-lbl">Week streak</div>
      </div>
    </div>
    <button class="completion-dismiss" onclick="dismissCompletion()">Let's go! 💪</button>
  </div>
</div>
<div class="profile-screen" id="profile-screen">
  <div class="profile-header">
    <div class="profile-header-top">
      <span class="profile-title">My Profile</span>
      <button class="profile-back" onclick="closeProfile()">← Back</button>
    </div>
    <div class="profile-sub" id="profile-week-label"></div>
  </div>
  <div class="profile-body" id="profile-body"></div>
</div>
<div id="user-screen">
  <div class="app-logo">
    <svg viewBox="0 0 24 24"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29l-1.43-1.43z"/></svg>
  </div>
  <h1>Workout Tracker</h1>
  <p>Who's working out today?</p>
  <div class="user-card" onclick="selectUser('brian')">
    <div class="user-avatar avatar-b">B</div>
    <div class="user-info"><h3>Brian</h3><p>Strength · Mon/Tue/Wed/Thu/Fri</p><button class="profile-btn" onclick="event.stopPropagation();openProfile('brian')">View progress →</button></div>
    <span class="user-arrow">›</span>
  </div>
  <div class="user-card" onclick="selectUser('ankita')">
    <div class="user-avatar avatar-a">A</div>
    <div class="user-info"><h3>Ankita</h3><p>HIIT · Tue lower · Thu upper</p><button class="profile-btn" onclick="event.stopPropagation();openProfile('ankita')">View progress →</button></div>
    <span class="user-arrow">›</span>
  </div>
</div>

<div id="app">
  <div class="header">
    <div class="header-top">
      <div class="header-user">
        <div class="header-avatar" id="hav"></div>
        <span class="header-name" id="hname"></span>
      </div>
      <button class="switch-btn" onclick="switchUser()">Switch</button>
    </div>
    <h2>Weekly Plan</h2>
    <div class="header-sub" id="wklabel"></div>
  </div>
  <div class="day-tabs-wrap"><div class="day-tabs" id="daytabs"></div></div>
  <div class="content" id="content"></div>
</div>

<script>
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

// ── BRIAN'S WORKOUTS ──────────────────────────────────────
// Mon & Thu = same (Chest + Triceps)
const BRIAN_CHEST_TRI = [
  {id:"ct1", name:"Cable Chest Press (Flat)", muscle:"Chest", sets:3, reps:"8–10", eq:"cable",
   desc:"Centr 2 pulleys at chest height. Stand centered, staggered stance. Press handles forward until arms extended. Keep shoulder blades retracted. Primary chest strength movement — go as heavy as clean form allows.",
   video:"1lx5o8UM7_c|66|86"},
  {id:"ct2", name:"Incline Dumbbell Press", muscle:"Upper Chest", sets:3, reps:"8–10", eq:"dumbbell",
   desc:"Bench at 30-45°. Press dumbbells from upper chest up and slightly inward. Lower slowly for a full stretch at the bottom. Great upper pec builder after the heavy cable pressing.",
   video:"https://www.youtube.com/shorts/8fXfwG4ftaQ"},
  {id:"ct3", name:"Incline Cable Chest Fly", muscle:"Upper Chest", sets:3, reps:"10–12", eq:"cable",
   desc:"Centr 2 pulleys at lowest position, bench at 30-45°. Arms extended above upper chest, slight elbow bend. Lower in a wide arc feeling the upper pec stretch. Squeeze handles back together at the top.",
   video:"1lx5o8UM7_c|87|94"},
  {id:"ct4", name:"Decline Cable Chest Fly", muscle:"Lower Chest", sets:3, reps:"10–12", eq:"cable",
   desc:"Centr 2 pulleys at lowest position, bench on decline. Lower arms in a controlled arc feeling the lower pec stretch. Drive handles back up and together. Full squeeze at the top of every rep.",
   video:"1lx5o8UM7_c|95|99"},
  {id:"ct5", name:"Cable Tricep Pushdown (Rope)", muscle:"Triceps", sets:3, reps:"10–12", eq:"cable",

  return arr.map(ex => ({ ...ex, id: ex.id + '_' + daySuffix }));
}

// ── WEEKLY RESET ──────────────────────────────────────────
function getMondayStr(offset=0) {
  const now = new Date();
  const mon = new Date(now);
  mon.setDate(now.getDate() - ((now.getDay() + 6) % 7) - (offset * 7));
  return mon.toISOString().slice(0, 10);
}
const thisWeek = getMondayStr();
const savedWeek = localStorage.getItem('wt-week');
if (savedWeek !== thisWeek) {
  // Archive current week before wiping
  const currentData = localStorage.getItem('wt-v4');
  if (currentData && savedWeek) {
    localStorage.setItem('wt-history-' + savedWeek, currentData);
    // Also save which days were completed that week
    const lastDone = localStorage.getItem('wt-lastdone');
    if (lastDone) localStorage.setItem('wt-lastdone-prev', lastDone);
  }
  localStorage.removeItem('wt-v4');
  localStorage.setItem('wt-week', thisWeek);
  localStorage.removeItem('wt-lastdone');
}

// ── STATE ─────────────────────────────────────────────────
let cu = null, cd = null;
let sd = JSON.parse(localStorage.getItem('wt-v4') || '{}');
function saveSd() { localStorage.setItem('wt-v4', JSON.stringify(sd)); }
function initU(u) { if (!sd[u]) sd[u] = {}; }
function isDone(u,eid,i) { return !!(sd[u]&&sd[u][eid]&&sd[u][eid][i]); }
function toggleS(u,eid,i) { initU(u); if(!sd[u][eid])sd[u][eid]={}; sd[u][eid][i]=!sd[u][eid][i]; saveSd(); }
function setsDone(u,ex) { let c=0; for(let i=0;i<ex.sets;i++) if(isDone(u,ex.id,i))c++; return c; }
function allDone(u,ex) { return setsDone(u,ex)===ex.sets; }
function dayProg(u,day) {
  let total=0, done=0;
  EX[u][day].forEach(ex=>{ total+=ex.sets; done+=setsDone(u,ex); });
  return {total,done};
}

function selectUser(u) {
  cu=u; initU(u);
  document.getElementById('user-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  const isA = u==='ankita';
  document.getElementById('hav').textContent = isA?'A':'B';
  document.getElementById('hav').style.background = isA?'#8A2C5F':'#1C4E3F';
  document.getElementById('hname').textContent = isA?'Ankita':'Brian';
  const now=new Date(), mon=new Date(now);
  mon.setDate(now.getDate()-((now.getDay()+6)%7));
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  document.getElementById('wklabel').textContent=`Week of ${f(mon)} – ${f(sun)}`;
  const ti=(new Date().getDay()+6)%7;
  cd = DAYS[Math.min(ti,6)];
  buildTabs(); renderDay(cd); updateLastDone(cu, cd);
}

function switchUser() {
  cu=null; cd=null;
  document.getElementById('app').style.display='none';
  document.getElementById('user-screen').style.display='flex';
}

function buildTabs() {
  const wrap=document.getElementById('daytabs'); wrap.innerHTML='';
  DAYS.forEach(day=>{
    const isRest = EX[cu][day].length===0;
    const btn=document.createElement('button');
    btn.className='day-tab'+(isRest?' rest-tab':'')+(day===cd?' active':'');
    btn.textContent=day.slice(0,3);
    btn.onclick=()=>{
      cd=day;
      document.querySelectorAll('.day-tab').forEach(t=>t.classList.remove('active'));
      btn.classList.add('active');
      renderDay(day);
    };
    wrap.appendChild(btn);
  });
}

function renderDay(day) {
  const exs=EX[cu][day], c=document.getElementById('content');
  const label = DAY_LABEL[cu][day] || '';

  if (!exs.length) {
    const msg = (REST_MSG[cu]&&REST_MSG[cu][day]) || 'Rest day. Recover well.';
    c.innerHTML=`<div class="rest-card"><div class="rest-icon">😴</div><h3>${label}</h3><p>${msg}</p></div>`;
    return;
  }

  const {total,done}=dayProg(cu,day);
  const pct=total>0?Math.round(done/total*100):0;

  const streak = getStreak(cu);
  const streakHtml = streak > 0 ? `<div class="streak-banner">
    <span class="streak-fire">🔥</span>
    <div class="streak-text"><h3>${streak} week streak!</h3><p>Keep it going — don't break the chain</p></div>
    <span class="streak-count">${streak}</span>
  </div>` : '';

  let h=`<div class="day-label-pill">${label}</div>
    ${streakHtml}
    <div class="progress-bar-wrap">
      <div class="progress-label"><span>${day}'s Workout</span><strong id="prog-lbl">${done}/${total} sets done</strong></div>
      <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:${pct}%"></div></div>
    </div>`;

  exs.forEach(ex=>{
    const dc=setsDone(cu,ex), ad=allDone(cu,ex);
    const eq=EQ_META[ex.eq]||{label:ex.eq,cls:''};
    let pills=`<span class="ex-muscle">${ex.muscle}</span><span class="ex-pill">${ex.sets} sets · ${ex.reps} reps</span><span class="eq-tag ${eq.cls}">${eq.label}</span>`;
    if(ad) pills+=`<span class="ex-pill done-pill" id="pill-${ex.id}">✓ Complete</span>`;
    else if(dc>0) pills+=`<span class="ex-pill partial-pill" id="pill-${ex.id}">${dc}/${ex.sets} sets</span>`;
    else pills+=`<span class="ex-pill" id="pill-${ex.id}" style="display:none"></span>`;

    let setbtns='';
    const exWts = getWeights(cu, ex.id);
    const prevWts = getPrevWeights(cu, ex.id);
    const exPRs = getPRs(cu, ex.id);
    for(let i=0;i<ex.sets;i++){
      const s=isDone(cu,ex.id,i);
      const wVal = exWts[i] || '';
      const prevW = prevWts[i] || '';
      const isPR = exPRs[i] || false;
      const prevLabel = prevW ? `Last: ${prevW}lbs` : 'First time';
      setbtns+=`<div class="weight-input-wrap">
        <span class="weight-input-label">Set ${i+1}</span>
        <button class="set-btn ${s?'done-set':''}" id="sb-${ex.id}-${i}" onclick="tapSet('${ex.id}',${i})" style="margin:0">
          <div class="scheck"><svg class="ck" viewBox="0 0 24 24" width="13" height="13"><path fill="white" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg></div>
        </button>
        <input class="weight-input ${isPR?'pr-set':''}" id="wi-${ex.id}-${i}" type="number" placeholder="lbs" value="${wVal}" onchange="saveWeight('${ex.id}',${i},this.value)" onclick="this.select()">
        <span class="weight-prev ${isPR?'has-pr':''}" id="wp-${ex.id}-${i}">${isPR?'🏆 PR!':prevLabel}</span>
      </div>`;
    }

    h+=`<div class="exercise-card ${ad?'all-done':''}" id="card-${ex.id}">
      <div class="ex-header" onclick="toggleExp('${ex.id}')">
        <div class="ex-info">
          <div class="ex-name" id="name-${ex.id}">${ex.name}</div>
          <div class="ex-meta">${pills}</div>
        </div>
        <button class="ex-expand-btn" id="ebtn-${ex.id}">⌄</button>
      </div>
      <div class="sets-panel" id="sp-${ex.id}">
        <div class="sets-label">Tap each set when complete</div>
        <div class="weight-row">${setbtns}</div>
        <button class="desc-toggle" onclick="toggleDesc('${ex.id}')">
          <span>Exercise description &amp; video</span>
          <span id="dtoggle-${ex.id}">↓</span>
        </button>
        <div class="desc-section" id="ds-${ex.id}">
          <p class="ex-desc">${ex.desc}</p>
          <button class="video-btn" onclick="openVideo('${ex.video}','${ex.name}')">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            Video Tutorial
          </button>
        </div>
      </div>
    </div>`;
  });

  c.innerHTML=h;
}

function toggleExp(eid) {
  const sp=document.getElementById('sp-'+eid), eb=document.getElementById('ebtn-'+eid);
  const wasOpen=sp.classList.contains('open');
  document.querySelectorAll('.sets-panel').forEach(p=>p.classList.remove('open'));
  document.querySelectorAll('.ex-expand-btn').forEach(b=>b.classList.remove('open'));
  if(!wasOpen){ sp.classList.add('open'); eb.classList.add('open'); }
}

function toggleDesc(eid) {
  const ds=document.getElementById('ds-'+eid), tog=document.getElementById('dtoggle-'+eid);
  ds.classList.toggle('open');
  tog.textContent=ds.classList.contains('open')?'↑':'↓';
}

function tapSet(eid, idx) {
  toggleS(cu, eid, idx);
  const s=isDone(cu,eid,idx);
  document.getElementById(`sb-${eid}-${idx}`).classList.toggle('done-set',s);

  const ex=EX[cu][cd].find(e=>e.id===eid); if(!ex)return;
  const dc=setsDone(cu,ex), ad=allDone(cu,ex);

  document.getElementById('card-'+eid).classList.toggle('all-done',ad);
  const nameEl=document.getElementById('name-'+eid);
  nameEl.style.textDecoration=ad?'line-through':'';
  nameEl.style.color=ad?'var(--muted)':'';

  const pill=document.getElementById('pill-'+eid);
  if(pill){
    pill.className='ex-pill'+(ad?' done-pill':(dc>0?' partial-pill':''));
    pill.style.display=dc>0||ad?'':'none';
    pill.textContent=ad?'✓ Complete':`${dc}/${ex.sets} sets`;
  }

  updateLastDone(cu, cd);
  const {total,done}=dayProg(cu,cd);
  const pct=total>0?Math.round(done/total*100):0;
  const fill=document.getElementById('prog-fill'), lbl=document.getElementById('prog-lbl');
  if(fill)fill.style.width=pct+'%';
  if(lbl)lbl.textContent=`${done}/${total} sets done`;

  // Check if entire day is complete
  if(done === total && total > 0) {
    setTimeout(() => showCompletion(cu, cd), 400);
  }
}

// ── VIDEO PLAYER ──────────────────────────────────────────
function openVideo(url, name) {
  // Convert any YouTube URL to embed with autoplay
  // Supports: regular watch, shorts, already-embed
  // Also supports start/end params: url can be "VIDEO_ID|start|end"
  let embedUrl = '';
  if (url.includes('|')) {
    // Custom format: "videoId|start|end"
    const parts = url.split('|');
    const vid = parts[0], start = parts[1]||0, end = parts[2]||'';
    embedUrl = `https://www.youtube.com/embed/${vid}?autoplay=1&start=${start}${end?'&end='+end:''}`;
  } else if (url.includes('youtube.com/shorts/')) {
    const vid = url.split('/shorts/')[1].split('?')[0];
    embedUrl = `https://www.youtube.com/embed/${vid}?autoplay=1`;
  } else if (url.includes('watch?v=')) {
    const vid = new URL(url).searchParams.get('v');
    const t = new URL(url).searchParams.get('t');
    embedUrl = `https://www.youtube.com/embed/${vid}?autoplay=1${t?'&start='+t:''}`;
  } else if (url.includes('youtu.be/')) {
    const vid = url.split('youtu.be/')[1].split('?')[0];
    embedUrl = `https://www.youtube.com/embed/${vid}?autoplay=1`;
  } else {
    embedUrl = url; // fallback
  }
  document.getElementById('video-iframe').src = embedUrl;
  document.getElementById('video-modal-title').textContent = name;
  document.getElementById('video-modal').classList.add('open');
}

function closeVideo() {
  document.getElementById('video-modal').classList.remove('open');
  document.getElementById('video-iframe').src = ''; // stop playback
}

// Close modal on backdrop tap
document.getElementById('video-modal').addEventListener('click', function(e) {
  if (e.target === this) closeVideo();
});

// ── PROFILE / HISTORY ─────────────────────────────────────
function updateLastDone(u, day) {
  if (EX[u][day].length === 0) return;
  const {done} = dayProg(u, day);
  if (done === 0) return;
  const ld = JSON.parse(localStorage.getItem('wt-lastdone') || '{}');
  ld[u] = { day, label: DAY_LABEL[u][day], date: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}) };
  localStorage.setItem('wt-lastdone', JSON.stringify(ld));
}

function openProfile(u) {
  document.getElementById('user-screen').style.display = 'none';
  const ps = document.getElementById('profile-screen');
  ps.style.display = 'flex';
  ps.style.flexDirection = 'column';

  const isA = u === 'ankita';
  const color = isA ? '#8A2C5F' : '#1C4E3F';
  const name = isA ? 'Ankita' : 'Brian';
  const sub = isA ? 'HIIT · Tue & Thu' : 'Strength · Mon–Fri';

  const now = new Date(), mon = new Date(now);
  mon.setDate(now.getDate() - ((now.getDay()+6)%7));
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const f = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  document.getElementById('profile-week-label').textContent = `Week of ${f(mon)} – ${f(sun)}`;

  // Last workout
  const ld = JSON.parse(localStorage.getItem('wt-lastdone') || '{}');
  const lastW = ld[u];

  // This week's data
  const thisData = JSON.parse(localStorage.getItem('wt-v4') || '{}')[u] || {};
  const lastWeekKey = getMondayStr(1);
  const lastWeekAllData = JSON.parse(localStorage.getItem('wt-history-' + lastWeekKey) || '{}');
  const lastData = lastWeekAllData[u] || {};

  // Calculate sets per week
  function countSets(userData, userId) {
    let total = 0, done = 0;
    DAYS.forEach(day => {
      EX[userId][day].forEach(ex => {
        total += ex.sets;
        for (let i = 0; i < ex.sets; i++) {
          if (userData[ex.id] && userData[ex.id][i]) done++;
        }
      });
    });
    return {total, done};
  }

  const thisStats = countSets(thisData, u);
  const lastStats = countSets(lastData, u);

  // Days completed this week
  function dayCompletion(userData, userId, day) {
    const exs = EX[userId][day];
    if (!exs.length) return null; // rest
    let total = 0, done = 0;
    exs.forEach(ex => {
      total += ex.sets;
      for (let i = 0; i < ex.sets; i++) {
        if (userData[ex.id] && userData[ex.id][i]) done++;
      }
    });
    return {total, done, pct: total > 0 ? Math.round(done/total*100) : 0};
  }

  // Build week grid
  function buildWeekGrid(userData, userId) {
    return DAYS.map(day => {
      const comp = dayCompletion(userData, userId, day);
      if (!comp) return `<div class="week-cell rest"><span class="wday">${day.slice(0,1)}</span><span class="wpct">—</span></div>`;
      const cls = comp.pct === 100 ? 'full' : comp.pct > 0 ? 'partial' : 'empty';
      return `<div class="week-cell ${cls}"><span class="wday">${day.slice(0,1)}</span><span class="wpct">${comp.pct > 0 ? comp.pct+'%' : '—'}</span></div>`;
    }).join('');
  }

  const lastWHtml = lastW
    ? `<div class="last-workout-row">
        <div class="last-workout-icon">💪</div>
        <div class="last-workout-info">
          <h4>${lastW.label}</h4>
          <p>${lastW.day} · ${lastW.date}</p>
        </div>
      </div>`
    : `<p class="no-data">No workouts logged yet this week.</p>`;

  const hasLastWeek = lastStats.done > 0;

  document.getElementById('profile-body').innerHTML = `
    <div class="profile-avatar-row">
      <div class="profile-avatar-big" style="background:${color}">${isA?'A':'B'}</div>
      <div>
        <div class="profile-user-name">${name}</div>
        <div class="profile-user-sub">${sub}</div>
      </div>
    </div>

    <div class="profile-section-label">Last Workout</div>
    <div class="stat-card">${lastWHtml}</div>

    <div class="profile-section-label">This Week</div>
    <div class="stat-card">
      <div class="stat-card-title">Sets completed</div>
      <div class="compare-row">
        <div class="compare-box">
          <div class="cb-val">${thisStats.done}</div>
          <div class="cb-lbl">This week</div>
        </div>
        <div class="compare-box">
          <div class="cb-val last-val">${hasLastWeek ? lastStats.done : '—'}</div>
          <div class="cb-lbl">Last week</div>
        </div>
        <div class="compare-box">
          <div class="cb-val" style="color:${thisStats.done >= lastStats.done && hasLastWeek ? 'var(--green)' : 'var(--muted)'}">
            ${hasLastWeek && lastStats.done > 0 ? (thisStats.done >= lastStats.done ? '↑' : '↓') : '—'}
          </div>
          <div class="cb-lbl">vs last week</div>
        </div>
      </div>
    </div>

    <div class="profile-section-label">This Week's Days</div>
    <div class="stat-card">
      <div class="week-grid">${buildWeekGrid(thisData, u)}</div>
    </div>

    ${hasLastWeek ? `
    <div class="profile-section-label">Last Week's Days</div>
    <div class="stat-card">
      <div class="week-grid">${buildWeekGrid(lastData, u)}</div>
    </div>` : ''}
  `;
}

function closeProfile() {
  document.getElementById('profile-screen').style.display = 'none';
  document.getElementById('user-screen').style.display = 'flex';
}

// ── WEIGHT TRACKING ───────────────────────────────────────
function getWeights(u, eid) {
  const w = JSON.parse(localStorage.getItem('wt-weights-' + thisWeek) || '{}');
  return (w[u] && w[u][eid]) || {};
}

function getPrevWeights(u, eid) {
  const prevKey = getMondayStr(1);
  const w = JSON.parse(localStorage.getItem('wt-weights-' + prevKey) || '{}');
  return (w[u] && w[u][eid]) || {};
}

function getPRs(u, eid) {
  // Returns {setIdx: true} for any set that's a new PR this week
  const cur = getWeights(u, eid);
  const prev = getPrevWeights(u, eid);
  const prs = {};
  Object.keys(cur).forEach(i => {
    const cw = parseFloat(cur[i]) || 0;
    const pw = parseFloat(prev[i]) || 0;
    if (cw > 0 && cw > pw) prs[i] = true;
  });
  return prs;
}

function saveWeight(eid, idx, val) {
  const key = 'wt-weights-' + thisWeek;
  const w = JSON.parse(localStorage.getItem(key) || '{}');
  if (!w[cu]) w[cu] = {};
  if (!w[cu][eid]) w[cu][eid] = {};
  w[cu][eid][idx] = val;
  localStorage.setItem(key, JSON.stringify(w));

  // Check PR
  const prev = getPrevWeights(cu, eid);
  const prevW = parseFloat(prev[idx]) || 0;
  const curW = parseFloat(val) || 0;
  const isPR = curW > 0 && curW > prevW;

  const inputEl = document.getElementById(`wi-${eid}-${idx}`);
  const prevEl = document.getElementById(`wp-${eid}-${idx}`);
  if (inputEl) inputEl.classList.toggle('pr-set', isPR);
  if (prevEl) {
    prevEl.classList.toggle('has-pr', isPR);
    prevEl.textContent = isPR ? '🏆 PR!' : (prevW > 0 ? `Last: ${prevW}lbs` : 'First time');
  }
}

// ── STREAK TRACKING ────────────────────────────────────────
function getStreak(u) {
  // Count consecutive weeks where user completed at least one workout day
  let streak = 0;
  // Check this week first
  const thisData = JSON.parse(localStorage.getItem('wt-v4') || '{}')[u] || {};
  const thisHasWork = Object.values(thisData).some(ex => Object.values(ex).some(Boolean));
  if (thisHasWork) streak++;

  // Check previous weeks
  for (let w = 1; w <= 52; w++) {
    const weekKey = getMondayStr(w);
    const histData = JSON.parse(localStorage.getItem('wt-history-' + weekKey) || '{}');
    const userData = histData[u] || {};
    const hasWork = Object.values(userData).some(ex => Object.values(ex).some(Boolean));
    if (hasWork) streak++;
    else break;
  }
  return streak;
}

function saveStreakCompletion(u) {
  const completedDays = JSON.parse(localStorage.getItem('wt-completed-days') || '{}');
  if (!completedDays[u]) completedDays[u] = [];
  if (!completedDays[u].includes(cd)) {
    completedDays[u].push(cd);
    localStorage.setItem('wt-completed-days', JSON.stringify(completedDays));
  }
}

// ── PR COUNT FOR DAY ───────────────────────────────────────
function countDayPRs(u, day) {
  const exs = EX[u][day];
  let prs = 0;
  exs.forEach(ex => {
    const p = getPRs(u, ex.id);
    prs += Object.keys(p).length;
  });
  return prs;
}

// ── COMPLETION CELEBRATION ─────────────────────────────────
function showCompletion(u, day) {
  saveStreakCompletion(u);
  const {total} = dayProg(u, day);
  const prs = countDayPRs(u, day);
  const streak = getStreak(u);
  const label = DAY_LABEL[u][day] || day;
  const isAnkita = u === 'ankita';

  const msgs = [
    `${label} is done. Beast mode activated. 💪`,
    `You crushed ${label}. Same time next week!`,
    `${label} complete. Your future self thanks you.`,
    `That's a wrap on ${label}. Go eat something good.`
  ];
  const msg = msgs[Math.floor(Math.random() * msgs.length)];
  const emojis = ['🎉','🏋️','💥','🔥','⚡'];
  const emoji = isAnkita ? '💃' : emojis[Math.floor(Math.random() * emojis.length)];

  document.getElementById('comp-emoji').textContent = emoji;
  document.getElementById('comp-title').textContent = 'Workout Complete!';
  document.getElementById('comp-msg').textContent = msg;
  document.getElementById('comp-sets').textContent = total;
  document.getElementById('comp-prs').textContent = prs;
  document.getElementById('comp-streak').textContent = streak + '🔥';

  document.getElementById('completion-overlay').classList.add('show');
  launchConfetti();
}

function dismissCompletion() {
  document.getElementById('completion-overlay').classList.remove('show');
}

function launchConfetti() {
  const colors = ['#1C4E3F','#3D8A69','#f0a500','#e74c3c','#3498db','#9b59b6','#2ecc71'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left: ${Math.random() * 100}vw;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        width: ${6 + Math.random() * 8}px;
        height: ${6 + Math.random() * 8}px;
        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
        animation-duration: ${1.5 + Math.random() * 2}s;
        animation-delay: ${Math.random() * 0.5}s;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }, i * 20);
  }
}
